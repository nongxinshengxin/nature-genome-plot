  derivation: style parameters read from Fig. 2b–g of the supplied PDF; palette sampled
    from the published boxes
visual_grammar:
  panels: 1 × n stacked, shared x
  fill: sequential gradient by diversity decile (yellow→orange→rose→purple→blue)
  box: black outline, median line, whiskers to 1.5×IQR, outliers hidden
  annotation: rho and P at top-left of each panel
  legend: horizontal colour bar above the stack, 0.0–1.0
when_to_use: 窗口级连续相关：diversity × TE/基因覆盖度、甲基化、重组率；需要展示分布而不只是均值
avoid_when: 窗口数 <200（分位不稳）；需要控制协变量时（应上偏相关或混合模型）
pitfalls:
- 分位标签只在最底面板
- P 极小值写 <2.2×10⁻¹⁶
- 箱线图不表达样本量
submission_safe: false
